services:
  flora:
    build: .
    container_name: flora_agent
    restart: always
    env_file:
      - .env
    volumes:
      # Persistent storage for SQLite database and ChromaDB
      - flora_data:/app/data
      # Directory where projects are cloned
      - flora_projects:/app/projects
      # Persist SSH keys across updates and restarts so they are never lost
      - flora_ssh:/root/.ssh
      # Mount the host docker socket so Flora can run sandboxed project containers
      - /var/run/docker.sock:/var/run/docker.sock
    # We can pass the path of the project volume on the host to know how to mount it in child containers
    environment:
      - PROJECTS_DIR=/app/projects
      - HOST_PROJECTS_DIR=/var/lib/docker/volumes/flora_projects/_data

volumes:
  flora_data:
    driver: local
  flora_projects:
    driver: local
  flora_ssh:
    driver: local
